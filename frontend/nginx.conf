server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Docker's embedded DNS. With a variable in proxy_pass, nginx resolves "api" per request
        # instead of once at startup, so it starts without the API and follows it when it is recreated.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        # No URI part after the host, so the original request URI is passed unchanged.
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
